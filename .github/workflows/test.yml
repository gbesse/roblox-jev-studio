name: test
on: [push, pull_request]
permissions: { contents: read }
jobs:
  node:
    runs-on: ubuntu-24.04
    strategy: { matrix: { node: [22, 24] } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: curl -fsSL https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip -o /tmp/luau.zip
      - run: mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
      - run: for file in src/*.lua; do /tmp/luau/luau-compile "$file" >/dev/null; done
      - run: npm test
      - run: npm run check
